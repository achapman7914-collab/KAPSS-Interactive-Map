name: Decode community artwork

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Decode exact approved community image
        run: |
          base64 -d foundation-preview/assets/community-approved-exact.b64.txt > foundation-preview/assets/community-approved.jpg
      - name: Commit decoded image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation-preview/assets/community-approved.jpg
          if git diff --cached --quiet; then
            echo "No image change needed"
          else
            git commit -m "Install exact approved community section image"
            git push
          fi
