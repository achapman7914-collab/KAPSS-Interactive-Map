name: Repair community artwork data

on:
  push:
    branches: [main]
    paths:
      - 'foundation-preview/assets/community-approved-exact.b64.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Decode approved artwork into website JPEG
        run: |
          base64 --decode foundation-preview/assets/community-approved-exact.b64.txt > foundation-preview/assets/community-approved.jpg
      - name: Commit repaired community image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation-preview/assets/community-approved.jpg
          if git diff --cached --quiet; then
            echo "Community image already matches approved artwork"
          else
            git commit -m "Restore clean approved community artwork"
            git push
          fi
