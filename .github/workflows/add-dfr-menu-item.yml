name: Add DFR menu item

on:
  push:
    paths:
      - '.github/workflows/add-dfr-menu-item.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add DFR Initiative to Training and Equipment dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('foundation-preview/training-equipment.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="training-equipment.html">Training &amp; Equipment</a></div>'
          new = '<a href="training-equipment.html">Training &amp; Equipment</a><a href="dfr.html">DFR Initiative</a></div>'
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Menu anchor not found; no change made')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation-preview/training-equipment.html
          git commit -m "Add DFR Initiative to Training & Equipment menu"
          git push
