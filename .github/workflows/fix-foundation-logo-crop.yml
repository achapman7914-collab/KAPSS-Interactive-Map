name: Fix Foundation logo crop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-foundation-logo-crop.yml'

permissions:
  contents: write

jobs:
  fix-logo-crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Foundation logo image fitting across interior pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          selectors = [r'\.brand img', r'\.footer-logo', r'\.donate-logo', r'\.logo']

          for path in Path('foundation-preview').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              for selector in selectors:
                  pattern = rf'({selector}\s*\{{)([^}}]*)(\}})'

                  def fix_rule(match):
                      body = match.group(2)
                      body = re.sub(r'border-radius\s*:\s*50%', 'border-radius:0', body)
                      body = re.sub(r'object-fit\s*:\s*cover', 'object-fit:contain', body)
                      return match.group(1) + body + match.group(3)

                  text = re.sub(pattern, fix_rule, text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'Updated {path}')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add foundation-preview/*.html
          git commit -m 'Normalize Foundation logo display on interior pages'
          git push
