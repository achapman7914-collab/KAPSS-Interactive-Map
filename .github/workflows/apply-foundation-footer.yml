name: Apply Foundation Footer
on:
  push:
    branches: [main]
    paths:
      - 'foundation-preview/site-footer.js'
      - '.github/workflows/apply-foundation-footer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared footer to Foundation pages
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('foundation-preview')
          skip={'receipt-generator.html','grappler.html'}
          tag='<script src="site-footer.js?v=20260903"></script>'
          changed=[]
          for p in root.glob('*.html'):
              if p.name in skip: continue
              text=p.read_text(encoding='utf-8')
              if tag in text: continue
              if '</body>' in text:
                  text=text.replace('</body>',tag+'</body>')
                  p.write_text(text,encoding='utf-8')
                  changed.append(p.name)
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit footer rollout
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation-preview/*.html
          git commit -m "Apply new Foundation footer across website"
          git push
