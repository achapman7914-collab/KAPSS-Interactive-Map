<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadership | Jeffersontown Police Foundation</title><meta name="description" content="Meet the Board of Directors of the Jeffersontown Police Foundation."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Franklin:wght@700;800;900&family=Roboto+Slab:wght@700;800&display=swap" rel="stylesheet"></head><body><div id="page-loading" style="font-family:Arial,sans-serif;padding:40px;text-align:center">Loading leadership…</div><script>(async function(){try{const r=await fetch('index.html?v=leadership-page');const html=await r.text();const d=new DOMParser().parseFromString(html,'text/html');const style=d.querySelector('style');if(style)document.head.appendChild(style.cloneNode(true));const header=d.querySelector('.site-header');const leadership=d.querySelector('#leadership');const footer=d.querySelector('.footer');if(!header||!leadership||!footer)throw new Error('Leadership content not found');document.body.innerHTML='';const h=header.cloneNode(true);const brand=h.querySelector('.brand');if(brand)brand.setAttribute('href','index.html');h.querySelectorAll('nav a').forEach(a=>{const href=a.getAttribute('href')||'';if(href==='#leadership')a.setAttribute('href','#leadership');else if(href.startsWith('#'))a.setAttribute('href','index.html'+href);});document.body.appendChild(h);const main=document.createElement('main');main.id='top';main.appendChild(leadership.cloneNode(true));document.body.appendChild(main);document.body.appendChild(footer.cloneNode(true));}catch(e){document.getElementById('page-loading').textContent='Unable to load leadership content.';console.error(e);}})();</script></body></html>
